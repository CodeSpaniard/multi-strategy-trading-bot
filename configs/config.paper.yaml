paper_mode: true

symbols:
  - SPY
  - QQQ
  - IWM
  - SMH
  - TSLA
  - AAPL

strategy:
  mode: dip          # "breakout" = momentum (BUY on +threshold) ; "dip" = mean-reversion (BUY on -threshold)
  lookback_minutes: 20
  momentum_threshold_pct: 0.3
  take_profit_pct: 0.5
  stop_loss_pct: 0.3
  trailing_stop_pct: 0.2

risk:
  max_position_usd: 250
  daily_loss_limit_usd: 500
  max_trades_per_day: 999

loop:
  poll_seconds: 60

paper_mode: false
broker: coinbase
asset_class: crypto

symbols:
  - BTC-USDC
  - ETH-USDC

strategy:
  mode: trend
  ma_fast: 20
  ma_slow: 100
  take_profit_pct: 40.0
  stop_loss_pct: 15.0
  trailing_stop_pct: 12.0

risk:
  max_trades_per_day: 999

sizing:
  enabled: true
  divisor: 2                  # per-trade = equity/2 (split between BTC, ETH)
  training_wheel_cap_usd: 100
  training_wheel_trades: 20
  max_growth_ratio: 1.5
  dd_threshold_pct: 10.0
  dd_lookback_days: 7
  freeze_days: 7

loop:
  poll_seconds: 3600   # check once per hour
  fill_timeout_s: 10

# Sprint 3 capital-unlock gate: fires one Pushover the first time Coinbase
# equity crosses the threshold above which basis trade economics make sense
# (see project memory `project_basis_trade`). Below→above transition only;
# re-arms only if equity falls back below threshold × rearm_ratio (small
# hysteresis to avoid noise spam when equity sits near the line).
basis_trade:
  unlock_threshold_usd: 2000
  rearm_ratio: 0.95
